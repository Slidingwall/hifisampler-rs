name: Rust Release Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  BUILD_MODE: --release

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Release
        run: cargo build ${{ env.BUILD_MODE }}

      - name: Test Compile
        run: cargo test ${{ env.BUILD_MODE }} --no-run

      - name: Prepare final binary
        shell: bash
        run: |
          mkdir -p artifacts
          BIN_NAME="hifiserver-rust"
          case "${{ matrix.os }}" in
            ubuntu-latest)
              cp "target/release/$BIN_NAME" "artifacts/$BIN_NAME"
              ;;
            windows-latest)
              cp "target/release/$BIN_NAME.exe" "artifacts/$BIN_NAME.exe"
              ;;
            macos-latest)
              cp "target/release/$BIN_NAME" "artifacts/$BIN_NAME"
              ;;
          esac

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.os }}
          path: artifacts/*
