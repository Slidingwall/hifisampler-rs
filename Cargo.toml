[package]
name = "hifiserver-rust"
version = "1.1.0"
edition = "2024"

[dependencies]
hound = "3.5.1"
symphonia = "0.5.5" #Do not upgrade this!
rubato = { version = "0.16.2", default-features = false } #Do not upgrade this!
oxifft = { version = "0.3.2" , features = ["streaming"] }
bs1770 = "1.0.0"
biquad = "0.6.0"

ndarray = "0.17.2"
#rayon = "1.11.0"
regex = "1.12.3"

ort = "=2.0.0-rc.11"

axum = "0.8.9"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "fs", "macros"] }  
rust-ini = "=0.21.3"

anyhow = { version = "1.0.102", features = ["backtrace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

dashmap = "=6.2.1"
once_cell = "1.21.4"
fs2 = "0.4.3"
mimalloc = "0.1.52"

[profile.release]
debug = true
