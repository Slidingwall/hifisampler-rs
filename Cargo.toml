[package]
name = "hifiserver-rust"
version = "1.1.0"
edition = "2024"

[dependencies]
oxiaudio = { version = "0.2.1", features = ["pure"] }
phastft = "0.4.1"
ebur128 = "0.1.10"
biquad = "0.6.0"

ndarray ={version = "0.17.2" , features = ["rayon"]}
regex = "1.13.1"

ort = "=2.0.0-rc.13"

axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "fs", "macros"] }
rust-ini = "=0.21.3"

anyhow = { version = "1.0.104", features = ["backtrace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

once_cell = "1.21.4"
fs4 = "1.1.0"
mimalloc = "0.1.52"

[features]
default = ["ep-webgpu"]                                  
ep-webgpu   = ["ort/webgpu", "ort/lax-feature-matching"]  
ep-directml = ["ort/directml", "ort/lax-feature-matching"]                      
ep-coreml   = ["ort/coreml", "ort/lax-feature-matching"]  
ep-cuda     = ["ort/cuda", "ort/tensorrt", "ort/nvrtx", "ort/lax-feature-matching"]  
[profile.release]
debug = true
